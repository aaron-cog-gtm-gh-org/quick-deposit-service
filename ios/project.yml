name: RBCQuickDeposit
options:
  bundleIdPrefix: com.rbc.quickdeposit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RBCQuickDeposit:
    type: application
    platform: iOS
    sources:
      - path: RBCQuickDeposit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbc.quickdeposit.demo
        INFOPLIST_FILE: RBCQuickDeposit/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
